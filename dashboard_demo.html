<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFD (Demo)</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0d14;
    --panel: #111722;
    --panel-2: #1a2432;
    --border: #273346;
    --text: #edf3ff;
    --text-dim: #9baac1;
    --green: #81dec0;
    --red: #f7a4ac;
    --accent: #b2cbff;
    --accent-ink: #101c31;
    --accent-field: #1d2c4a;
    --buy-field: #1b3835;
    --sell-field: #342631;
    --shadow: 0 14px 42px #0005;
    --wash: #1a376b48;
    --chart-grid: #26344a;
    --chart-surface: #182640;
    --font-min: 12pt;
    --font-ui: 'Segoe UI Variable Text', 'Segoe UI', Tahoma, system-ui, sans-serif;
    --font-display: 'Segoe UI Variable Display', 'Segoe UI', Tahoma, system-ui, sans-serif;
    --font-mono: 'SF Mono', Consolas, Monaco, monospace;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #edf2f9;
    --panel: #fcfdff;
    --panel-2: #e9eff8;
    --border: #d5deec;
    --text: #13243d;
    --text-dim: #53657e;
    --green: #17624c;
    --red: #943a4e;
    --accent: #1b529c;
    --accent-ink: #fff;
    --accent-field: #dfeafe;
    --buy-field: #d9f2e8;
    --sell-field: #f9e7eb;
    --shadow: 0 12px 32px #253c6515;
    --wash: #aac8f854;
    --chart-grid: #d7e2f1;
    --chart-surface: #e2edff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; max-width: 100%; }
  html, body { overflow-x: hidden; width: 100%; }
  body {
    background: radial-gradient(ellipse 68% 440px at 50% 0, var(--wash), transparent), var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: var(--font-min);
    line-height: 1.4;
    min-height: 100vh;
    padding: 12px;
    transition: background 0.15s, color 0.15s;
  }
  .header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 4px 8px;
    margin-bottom: 16px;
  }
  .header-title { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 5px; min-width: 0; }
  .header-brand { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .header h1 {
    font: 680 clamp(20px, 5.7cqi, 25px)/1.15 var(--font-display);
    letter-spacing: -0.035em;
  }
  .header-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 6px; }
  .demo-label {
    display: inline-block;
    margin-inline-start: 5px;
    padding: 2px 5px;
    background: var(--accent-field);
    border-radius: 5px;
    color: var(--accent);
    font: var(--font-min) var(--font-mono);
    letter-spacing: 0.08em;
    vertical-align: middle;
  }
  .connection-status { display: inline-flex; color: var(--text-dim); }
  .connection-status[data-state="connected"] { color: var(--green); }
  .connection-status[data-state="offline"] { color: var(--red); }
  .connection-status svg { width: 14px; height: 14px; }
  .connection-status svg [data-icon] { display: none; }
  .connection-status[data-state="connecting"] [data-icon="connecting"],
  .connection-status[data-state="connected"] [data-icon="connected"],
  .connection-status[data-state="offline"] [data-icon="offline"] { display: block; }
  .connection-status span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
  }
  .stat-card { padding: 9px clamp(5px, 2cqi, 10px); white-space: nowrap; }
  .stat-card + .stat-card { border-inline-start: 1px solid var(--border); }
  .stat-card .label { margin-bottom: 3px; color: var(--text-dim); font-size: var(--font-min); }
  .stat-card .value { font: 600 var(--font-min)/1.25 var(--font-mono); white-space: normal; overflow-wrap: anywhere; }
  .stat-card .value.pos { color: var(--green); }
  .stat-card .value.neg { color: var(--red); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .panel-title {
    margin-bottom: 10px;
    font-size: var(--font-min);
    font-weight: 650;
    color: var(--text);
  }
  .chart-wrap { position: relative; height: 210px; }

  .table-wrap { overflow-x: auto; }

  /* Trade cards (เทรดล่าสุด) - 2 compact lines per trade instead of an 8-column
     table, which forced horizontal scrolling on a phone-width screen and cut off
     the action buttons entirely. flex-wrap is a safety net only (falls back to a
     3rd line if a screen is unusually narrow or a value unusually long) - the
     design target is 2 lines. */
  .trades-list { display: flex; flex-direction: column; }
  .trade-card { padding: 10px 4px; border-bottom: 1px solid var(--border); font-family: var(--font-mono); }
  .trade-card:last-child { border-bottom: none; }
  .trade-card-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
  .trade-card-row-main { font-size: var(--font-min); font-weight: 700; margin-bottom: 4px; }
  .trade-card-row-meta { font-size: var(--font-min); color: var(--text-dim); }
  .trade-card-time-profit { display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .trade-card-spacer { flex: 1 1 auto; }
  .trade-card-prices { white-space: nowrap; }
  .dir-buy { color: var(--green); }
  .dir-sell { color: var(--red); }
  .profit-pos { color: var(--green); }
  .profit-neg { color: var(--red); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: var(--font-min);
  }
  .empty-state .big { font-size: 32px; margin-bottom: 8px; }

  .market-order-actions {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr);
    gap: 8px;
  }
  .market-order-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    list-style: none;
    min-height: 44px;
    cursor: pointer;
    border-radius: 8px;
  }
  .market-order-toggle::-webkit-details-marker { display: none; }
  .market-order-toggle::after {
    content: "";
    flex: 0 0 7px;
    height: 7px;
    margin-inline-end: 3px;
    border: solid var(--text-dim);
    border-width: 0 1px 1px 0;
    transform: rotate(45deg);
  }
  .market-order-controls[open] .market-order-toggle::after { transform: rotate(225deg); }
  .market-order-toggle .market-order-heading { flex: 1; margin: 0; }
  .market-order-controls[open] .market-order-actions { margin-top: 8px; }
  .market-order-actions button { min-width: 0; padding-inline: 4px; }

  .close-all-btn {
    background: transparent;
    color: var(--red);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 14px;
    font-size: var(--font-min);
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .close-all-btn:hover { border-color: var(--red); }
  .close-all-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .close-order-btn {
    background: var(--panel-2);
    color: var(--red);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 4px 10px;
    font-size: var(--font-min);
    font-weight: 600;
    cursor: pointer;
  }
  .close-order-btn:hover { background: var(--sell-field); border-color: var(--red); }
  .close-order-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .engine-switch {
    position: relative;
    width: 34px;
    height: 20px;
    flex-shrink: 0;
  }
  .engine-switch input { position: absolute; width: 100%; height: 100%; opacity: 0; }
  .engine-switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }
  .engine-switch .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: var(--border);
    border-radius: 17px;
    transition: 0.15s;
  }
  .engine-switch .slider::before {
    content: '';
    position: absolute;
    height: 16px; width: 16px;
    left: 2px; bottom: 2px;
    background: white;
    border-radius: 50%;
    transition: 0.15s;
  }
  .engine-switch input:checked + .slider { background: var(--green); }
  .engine-switch input:checked + .slider::before { transform: translateX(14px); }

  .manual-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .manual-row:last-child { border-bottom: none; }
  .manual-status {
    font-family: var(--font-mono);
    font-size: var(--font-min);
    color: var(--text-dim);
    flex: 1;
  }
  .open-position-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .position-summary { display: flex; align-items: baseline; gap: 6px; min-width: 0; white-space: nowrap; }
  .position-source { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .position-profit { flex: 0 0 auto; margin-inline-start: auto; text-align: end; white-space: nowrap; color: var(--text-dim); }
  .position-profit.profit-pos { color: var(--green); }
  .position-profit.profit-neg { color: var(--red); }
  .manual-status.pos-buy { color: var(--green); }
  .manual-status.pos-sell { color: var(--red); }
  .manual-buy-btn, .manual-sell-btn {
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: var(--font-min);
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .manual-buy-btn { background: var(--buy-field); color: var(--green); border: 1px solid var(--green); }
  .manual-sell-btn { background: var(--sell-field); color: var(--red); border: 1px solid var(--red); }
  .manual-buy-btn:disabled, .manual-sell-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .opened-by-tag {
    font-size: var(--font-min);
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
  }
  .opened-by-tag.auto { background: var(--panel-2); color: var(--text-dim); }
  .opened-by-tag.manual { background: var(--accent-field); color: var(--accent); }
  #dashboardContent {
    container: dashboard / inline-size;
    max-width: 430px;
    margin-inline: auto;
  }

  .chart-panel.panel {
    padding: 0;
    overflow: hidden;
    border-radius: 17px;
    background: linear-gradient(160deg, var(--chart-surface), var(--panel) 54%);
    box-shadow: var(--shadow);
  }
  .settings-group { padding: 12px; border-top: 1px solid var(--border); }
  .settings-group h3 { font-size: var(--font-min); font-weight: 600; }
  .settings-heading, .settings-row { display: flex; align-items: center; gap: 8px; }
  .settings-heading { justify-content: space-between; margin-bottom: 8px; }
  .settings-row { align-items: end; flex-wrap: wrap; }
  .settings-row label { display: grid; gap: 4px; flex: 1 1 70px; font-size: var(--font-min); color: var(--text-dim); }
  .settings-row input, .settings-row select, .save-btn {
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--panel-2);
    color: var(--text);
    padding: 7px;
  }
  .settings-row label:has(input[type="time"]) { flex-basis: 124px; }
  .settings-row input, .settings-row select { width: 100%; min-height: 44px; font-size: var(--font-min); }
  .settings-row select { flex: 1; }
  .save-btn { cursor: pointer; padding-inline: 10px; font-size: var(--font-min); }
  .setting-status { display: block; color: var(--text-dim); font-size: var(--font-min); }
  .setting-status:not(:empty) { margin-top: 6px; }
  .toggle-setting { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 38px; }
  .login-card {
    width: 100%;
    max-width: 340px;
    padding: 26px;
    border: 1px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 15px;
    background: var(--panel);
    box-shadow: var(--shadow);
  }
  .login-title { margin-bottom: 18px; font: 680 24px/1.2 var(--font-display); letter-spacing: -0.035em; }
  #loginBtn {
    width: 100%;
    min-height: 44px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    font: 650 var(--font-min) var(--font-ui);
    cursor: pointer;
  }
  :where(button, summary, input, select):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .manual-positions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 0 0 8px 50px;
  }


  .header-icon {
    position: relative;
    display: inline-grid;
    flex: 0 0 44px;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    color: var(--text-dim);
    cursor: pointer;
  }
  .header-icon:hover { color: var(--accent); border-color: var(--accent); }
  .header-icon > input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .header-icon:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .header-icon[data-engine-wrap] { color: var(--red); background: var(--sell-field); border-color: var(--red); }
  .header-icon[data-engine-wrap]:has(input:checked) { color: var(--green); background: var(--buy-field); border-color: var(--green); }
  .header-icon[data-engine-wrap] .icon-power { display: none; }
  .header-icon[data-engine-wrap]:has(input:checked) .icon-power { display: block; }
  .header-icon[data-engine-wrap]:has(input:checked) .icon-power-off { display: none; }
  [data-language-toggle] { font: 700 var(--font-min) var(--font-mono); letter-spacing: .04em; }
  .header-icon[aria-pressed="true"] { color: var(--accent); background: var(--accent-field); }
  .login-language { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .ui-icon { width: 20px; height: 20px; pointer-events: none; }
  .header-icon { border-radius: 12px; background: var(--panel-2); }
  #themeToggleBtn .icon-moon,
  #themeToggleBtn[aria-pressed="true"] .icon-sun { display: none; }
  #themeToggleBtn[aria-pressed="true"] .icon-moon { display: block; }
  .dashboard-dialog {
    position: fixed;
    inset: 0;
    width: min(430px, calc(100% - 24px));
    max-height: calc(100dvh - 28px);
    overflow-y: auto;
    overscroll-behavior: contain;
    margin: auto;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--panel);
    color: var(--text);
    box-shadow: var(--shadow);
    scrollbar-width: thin;
  }
  .dashboard-dialog::backdrop { background: #070a12b8; }
  .dashboard-dialog-header {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 12px;
    background: var(--panel);
  }
  .dashboard-dialog-header .panel-title { margin: 0; }
  .history-dialog .table-wrap { padding: 0 12px 8px; }

  .market-order-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 10px;
  }
  .market-order-heading { flex-wrap: wrap; }
  .market-order-heading .panel-title { margin: 0; }
  .market-status {
    display: flex;
    align-items: baseline;
    gap: 5px;
    color: var(--text-dim);
    font-size: var(--font-min);
    flex-wrap: wrap;
  }
  .market-status [data-level="high"] { color: var(--red); }
  #marketClock { font-family: var(--font-mono); }
  .ema-inputs { margin-top: 8px; }
  .countdown { padding: 11px 12px 7px; }
  .countdown-row { display: flex; justify-content: space-between; gap: 8px; font-size: var(--font-min); color: var(--text-dim); }
  .countdown-row b { color: var(--text); font: 650 var(--font-min) var(--font-mono); }
  .countdown-track { position: relative; overflow: hidden; height: 4px; margin-top: 6px; border-radius: 4px; background: var(--border); }
  #h4CountdownFill { width: 0; height: 100%; background: var(--accent); }
  #h4CountdownTicks { position: absolute; inset: 0; }

  @container dashboard (max-width: 480px) {
    .panel { padding: 12px; }
    .manual-positions { padding-inline-start: 0; }
    .manual-buy-btn, .manual-sell-btn,
    .close-all-btn, .close-order-btn, .save-btn { min-height: 44px; }
    .close-order-btn { flex-shrink: 0; }
    .trade-card-prices { white-space: normal; overflow-wrap: anywhere; }
  }

  @container dashboard (max-width: 340px) {
    .header-actions { gap: 2px; }
    .demo-label { margin-inline-start: 0; }
  }

  @media (min-width: 700px) {
    body { padding: 24px 32px; }
  }
</style>
</head>
<body>

<div id="loginOverlay" style="position:fixed; inset:0; background:var(--bg); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px;">
  <div class="login-card">
    <div class="login-language"><button type="button" class="header-icon" data-language-toggle aria-label="เปลี่ยนภาษา" title="เปลี่ยนภาษา"><span aria-hidden="true">TH</span></button></div>
    <div class="login-title">CFD (Demo)</div>
    <form id="loginForm" autocomplete="on">
      <div style="margin-bottom:12px;">
        <input id="loginEmail" name="email" type="email" placeholder="อีเมล" aria-label="อีเมล" data-i18n-aria="email" data-i18n-placeholder="email" autocomplete="username"
          style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font-size:var(--font-min);">
      </div>
      <div style="margin-bottom:12px;">
        <input id="loginPassword" name="password" type="password" placeholder="รหัสผ่าน" aria-label="รหัสผ่าน" data-i18n-aria="password" data-i18n-placeholder="password" autocomplete="current-password"
          style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font-size:var(--font-min);">
      </div>
      <button id="loginBtn" type="submit" data-i18n="login">
        เข้าสู่ระบบ
      </button>
    </form>
    <div id="loginError" style="color:var(--red); font-size:var(--font-min); margin-top:10px; display:none;"></div>
  </div>
</div>

<div id="dashboardContent" style="display:none;">

<header class="header">
  <div class="header-title">
    <div class="header-brand">
      <h1>CFD</h1>
      <div id="connectionStatus" class="connection-status" role="status" data-state="connecting" data-i18n-title="connecting" title="กำลังเชื่อมต่อ…">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="8" r="6.5"/>
          <path data-icon="connecting" d="M5 8h6"/>
          <path data-icon="connected" d="m4.8 8 2 2 4.4-4.4"/>
          <path data-icon="offline" d="m5.5 5.5 5 5m0-5-5 5"/>
        </svg>
        <span id="statusText" data-i18n="connecting">กำลังเชื่อมต่อ…</span>
      </div>
    </div>
    <span class="demo-label">Demo</span>
  </div>
  <div class="header-actions">
      <label class="header-icon" data-engine-wrap="H4" data-i18n-title="autoTrading" title="เปิดหรือปิดการเทรดอัตโนมัติ">
        <input type="checkbox" checked data-engine-toggle="H4" data-i18n-aria="autoTrading" aria-label="เปิดหรือปิดการเทรดอัตโนมัติ">
        <svg class="ui-icon icon-power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v9M7 5.7a8 8 0 1 0 10 0"/></svg>
        <svg class="ui-icon icon-power-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="m6 18 12-12"/></svg>
      </label>
      <button type="button" class="header-icon" data-language-toggle aria-label="เปลี่ยนภาษา" title="เปลี่ยนภาษา"><span aria-hidden="true">TH</span></button>
      <button id="themeToggleBtn" type="button" class="header-icon" data-i18n-aria="theme" data-i18n-title="theme" aria-label="ธีมสว่าง" title="ธีมสว่าง" aria-pressed="false">

// --- H4 bar-close countdown. Bar times are broker-server time, so the offset between the
// broker clock and this browser is learned from bot_control/server_clock (broker tick time
// vs Firestore's own timestamp at the same instant). Display only. ---
let serverClockOffsetMs = null;
let serverClockUpdatedMs = null;
const H4_MS = 4 * 60 * 60 * 1000;

function renderH4Countdown() {
  const timeEl = document.getElementById('h4CountdownTime');
  const pctEl = document.getElementById('h4CountdownPct');
  const fillEl = document.getElementById('h4CountdownFill');
  const ticksEl = document.getElementById('h4CountdownTicks');
  if (!timeEl) return;
  const c = charts['H4'];
  const bars = c && c.lastBars;
  const stale = serverClockUpdatedMs === null || (Date.now() - serverClockUpdatedMs) > 5 * 60 * 1000;
  if (!bars || !bars.length || serverClockOffsetMs === null || stale) {
    timeEl.textContent = '–';
    pctEl.textContent = stale && serverClockUpdatedMs !== null ? tr('clockStale') : tr('clockWaiting');
    fillEl.style.width = '0%';
    return;
  }
  const openMs = bars[bars.length - 1].time * 1000;
  const brokerNow = Date.now() + serverClockOffsetMs;
  const elapsed = brokerNow - openMs;
  if (elapsed < 0 || elapsed > H4_MS + 60000) {
    timeEl.textContent = '–';
    pctEl.textContent = tr('barWaiting');
    fillEl.style.width = '0%';
    return;
  }
  const remaining = Math.max(0, H4_MS - elapsed);
  const pad = n => String(n).padStart(2, '0');
  const totalSec = Math.floor(remaining / 1000);
  timeEl.textContent = `${pad(Math.floor(totalSec / 3600))}:${pad(Math.floor((totalSec % 3600) / 60))}:${pad(totalSec % 60)}`;
  const pct = Math.min(100, (elapsed / H4_MS) * 100);
  pctEl.textContent = Math.round(pct) + '%';
  fillEl.style.width = pct.toFixed(1) + '%';
  // tick marks = the speed setting's slices (divisor 4 -> every 25%, 8 -> 12.5%, 16 -> 6.25%)
  const divisor = parseInt(document.getElementById('entryConfirmDivisor').value, 10) || 1;
  if (ticksEl.dataset.divisor !== String(divisor)) {
    ticksEl.dataset.divisor = String(divisor);
    ticksEl.innerHTML = '';
    if (divisor > 1) {
      for (let i = 1; i < divisor; i++) {
        const t = document.createElement('div');
        t.style.cssText = `position:absolute; top:0; bottom:0; left:${(i / divisor) * 100}%; width:1px; background:var(--text-dim); opacity:0.6;`;
        ticksEl.appendChild(t);
      }
    }
  }
}

function createSwingLabelLayer(chart, series) {
  const fontFamily = getComputedStyle(document.documentElement).getPropertyValue('--font-mono').trim();
  const font = '8pt ' + fontFamily;
  let marks = [];
  let coordinates = [];
  let redraw = () => {};

  const paneView = {
    zOrder: () => 'top',
    renderer: () => ({
      draw(target) {
        target.useMediaCoordinateSpace(({ context, mediaSize }) => {
          context.font = font;
          context.textAlign = 'left';
          context.textBaseline = 'top';
          const occupied = [];
          for (const mark of coordinates) {
            const width = Math.ceil(context.measureText(mark.text).width);
            const height = 12;
            if (mark.x < 0 || mark.x > mediaSize.width || width + 4 > mediaSize.width) continue;
            const x = Math.max(2, Math.min(mark.x - width / 2, mediaSize.width - width - 2));
            const y = mark.position === 'aboveBar' ? mark.y - height - 12 : mark.y + 12;
            if (y < 0 || y + height > mediaSize.height) continue;
            if (occupied.some(box => x < box.right + 2 && x + width + 2 > box.left
                && y < box.bottom + 2 && y + height + 2 > box.top)) continue;

            context.fillStyle = mark.color;
            context.fillText(mark.text, x, y);
            occupied.push({ left: x, top: y, right: x + width, bottom: y + height });
          }
        });
      },
    }),
  };
  const views = [paneView];

  return {
    attached({ requestUpdate }) { redraw = requestUpdate; },
    paneViews() { return views; },
    setMarks(next) {
      marks = [...next].sort((a, b) => b.time - a.time);
      redraw();
    },
    updateAllViews() {
      const timeScale = chart.timeScale();
      coordinates = marks.flatMap(mark => {
        const x = timeScale.timeToCoordinate(mark.time);
        const y = series.priceToCoordinate(mark.price);
        return x === null || y === null ? [] : [{ ...mark, x, y }];
      });
    },
  };
}

// Canonical list of actual trading engines (matches config.json's engine names and
// the "engine" field on every trade doc in Firestore). Kept as its OWN constant -
// NEVER derive this list from SWING_LOOKBACK_DEFAULTS' keys, since those are now
// "lookback profile" keys (H1 has two: H1_entry/H1_carry) that don't map 1:1 to
// engines anymore. Anything that needs "the list of engines" (per-engine stats
// table, chart setup, etc) must read ENGINE_NAMES, not the lookback config.
const ENGINE_NAMES = ['H4']; // H1 retired (see area notes, Sep 18 "H1 retired" decision)

// How many candles must be lower/higher on EACH side for a bar to count as a swing
// high/low ("wave" turning point). Faster timeframes get a larger lookback so noisy
// H1 candles don't produce a swing label on almost every bar.
//
// H4 runs TWO independent lookback profiles in parallel (originally built for
// H1's dual-task design - see area notes Sep 13 "H4 gets H1's architecture"
// discussion; H1 itself has since been retired, see area notes Sep 18. H4's own
// entry-task/carry-task split was later removed too - see the Sep 2026 redesign
// notes at the top of main.py - but this SWING PROFILE split stays, just
// re-purposed by SL role rather than by which task "owns" the position):
//   - <engine>_entry: fast/tight lookback - the initial SL for every fresh
//     entry AND every Dow re-entry (see main.py's EngineState docs), so it
//     doesn't miss a reversal near entry.
//   - <engine>_carry: slower/looser lookback - what EVERY open H4 position
//     trails against once it's open (see main.py's apply_trailing_stop), so a
//     normal pullback during a strong trend doesn't get read as a reversal.
//
// Fallback values used only until Firestore's bot_control/swing_lookback loads
// (or if that document doesn't exist yet) - the working values below get
// overwritten by the onSnapshot listener further down, so they can be tuned
// live from the dashboard without editing this file or redeploying.
const SWING_LOOKBACK_DEFAULTS = { H4_entry: 1, H4_carry: 2 };
// Per-profile valid range (bars) for the adjustable-scale inputs below. Bounds
// are chosen so every profile's REAL-TIME delay (lookback x bar length) stays
// in a broadly comparable band, instead of letting a small bar-count on a slow
// timeframe (e.g. H4) translate into an enormous real delay - min 1 bar
// everywhere (never 0, which breaks the fractal loop), max shrinks as the
// timeframe grows so nothing can accidentally get tuned into an hours-long
// swing-confirmation delay by mistake.
const SWING_LOOKBACK_RANGE = { H4_entry: [1, 4], H4_carry: [1, 4] };
let SWING_LOOKBACK = { ...SWING_LOOKBACK_DEFAULTS };

// Which lookback profiles to compute for each engine, and where each profile's
// result lands in Firestore's swing_points/{engine} document. Multiple profiles
// for the same engine merge into ONE setDoc call (see recomputeSwings) - still
// just 1 Firestore write per engine per update, not 2. H4's fieldSuffix values
// ('_entry'/'_carry') match H1's original ones exactly - the Python/bot side
// reads either engine's per-profile fields the same generic way (see swing_points.py).
const SWING_PROFILES = {
  H4: [
    { lookbackKey: 'H4_entry', fieldSuffix: '_entry', markerColorHigh: '#9b59b6', markerColorLow: '#3498db', shape: 'square', labelSuffix: '' },
    { lookbackKey: 'H4_carry', fieldSuffix: '_carry', markerColorHigh: '#e0a8f0', markerColorLow: '#a8d0f0', shape: 'circle', labelSuffix: '' },
  ],
};
// Reverse lookup: given a lookback profile key (as saved in SWING_LOOKBACK /
// bot_control/swing_lookback), which chart engine does it belong to. Needed
// because a profile key (e.g. "H1_carry") is NOT itself a valid chart/engine
// name - only "H1" is. Anything that used to do recomputeSwings(profileKey, db)
// must instead resolve through this map first.
const LOOKBACK_KEY_TO_ENGINE = {};
for (const engine of ENGINE_NAMES) {
  for (const profile of SWING_PROFILES[engine]) {
    LOOKBACK_KEY_TO_ENGINE[profile.lookbackKey] = engine;
  }
}

function findSwingPoints(bars, lookback) {
  const swings = [];
  for (let i = lookback; i < bars.length - lookback; i++) {
    const window = bars.slice(i - lookback, i + lookback + 1);
    if (window.every(b => b.high <= bars[i].high)) {
      swings.push({ type: 'high', time: bars[i].time, price: bars[i].high });
    }
    if (window.every(b => b.low >= bars[i].low)) {
      swings.push({ type: 'low', time: bars[i].time, price: bars[i].low });
    }
  }
  return swings;
}

// Chart labels only: keep the latest N highs and N lows per profile so the chart stays
// readable. Display-only - the swing values synced to the bot are computed from the full list.
const MAX_SWING_LABELS_PER_SIDE = 3;
function limitSwingsForDisplay(swings) {
  const keep = new Set();
  ['high', 'low'].forEach(type => {
    swings.filter(s => s.type === type).slice(-MAX_SWING_LABELS_PER_SIDE).forEach(s => keep.add(s));
  });
  return swings.filter(s => keep.has(s));
}

function swingsToMarkers(swings, style = {}) {
  const shape = style.shape || 'square';
  const colorHigh = style.markerColorHigh || '#9b59b6';
  const colorLow = style.markerColorLow || '#3498db';
  const labelSuffix = style.labelSuffix || '';
  return swings.map(s => ({
    time: s.time,
    price: s.price,
    position: s.type === 'high' ? 'aboveBar' : 'belowBar',
    color: s.type === 'high' ? colorHigh : colorLow,
    shape,
    text: `${s.type === 'high' ? 'H' : 'L'} ${s.price.toFixed(2)}${labelSuffix}`,
  }));
}

function getLatestPrice(engineName) {
  const c = charts[engineName];
  if (!c || !c.lastBars || c.lastBars.length === 0) return null;
  return c.lastBars[c.lastBars.length - 1].close;
}

function floatingPriceChange(trade) {
  const livePrice = getLatestPrice(trade.engine);
  const entry = parseFloat(trade.entry_price);
  if (!Number.isFinite(livePrice) || !Number.isFinite(entry)) return null;
  return trade.direction === 'BUY' ? livePrice - entry : entry - livePrice;
}

function floatingProfitDisplay(trade) {
  const value = floatingPriceChange(trade);
  if (value == null) return { text: tr('openState'), className: '' };
  return {
    text: fmtMoney(value),
    className: value >= 0 ? 'profit-pos' : 'profit-neg',
  };
}

function updateManualTradeProfits() {
  for (const element of document.querySelectorAll('#manualTradePanel [data-position-profit]')) {
    const trade = allTrades[Number(element.dataset.positionProfit)];
    if (!trade) continue;
    const { text, className } = floatingProfitDisplay(trade);
    element.textContent = className ? text : '—';
    element.className = 'position-profit ' + className;
  }
}

function updateSlLine(engineName) {
  const c = charts[engineName];
  if (!c || !c.candleSeries) return;
  (c.slPriceLines || []).forEach(line => c.candleSeries.removePriceLine(line));
  c.slPriceLines = [];
  const openTrades = allTrades.filter(t => t.engine === engineName && t.status === 'open' && t.sl_price != null);
  openTrades.forEach(t => {
    c.slPriceLines.push(c.candleSeries.createPriceLine({
      price: parseFloat(t.sl_price),
      color: '#ef5350',
      lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true,
      title: 'SL',
    }));
  });
}

function updateEntryLine(engineName) {
  const c = charts[engineName];
  if (!c || !c.candleSeries) return;
  (c.entryPriceLines || []).forEach(line => c.candleSeries.removePriceLine(line));
  c.entryPriceLines = [];
  const openTrades = allTrades.filter(t => t.engine === engineName && t.status === 'open' && t.entry_price != null);
  openTrades.forEach(t => {
    c.entryPriceLines.push(c.candleSeries.createPriceLine({
      price: parseFloat(t.entry_price),
      color: '#f4d03f',
      lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid,
      axisLabelVisible: true,
      title: 'Entry',
    }));
  });
}

function updateChartMarkers(engineName) {
  const c = charts[engineName];
  if (!c || !c.candleSeries) return;
  const openTrades = allTrades.filter(t => t.engine === engineName && t.status === 'open');
  const markers = [];

  openTrades.forEach(t => {
    try {
      const isBuy = t.direction === 'BUY';
      markers.push({
        time: Math.floor(new Date(t.entry_time).getTime() / 1000),
        position: isBuy ? 'belowBar' : 'aboveBar',
        color: isBuy ? '#26a69a' : '#ef5350',
        shape: isBuy ? 'arrowUp' : 'arrowDown',
        text: `${tradeSideLabel(t.direction)} @ ${parseFloat(t.entry_price).toFixed(2)}`,
      });
    } catch (e) {
      // BUG FIX: one malformed/incomplete trade doc (e.g. a hand-edited test doc
      // missing a field) used to throw here and abort the whole forEach, silently
      // dropping markers for every OTHER trade on this engine too. Skip just this
      // one trade instead.
      console.error(`skipping malformed trade doc for ${engineName} marker`, t, e);
    }
  });

  const profiles = chartDisplay.show_swings ? (SWING_PROFILES[engineName] || []) : [];
  const swingMarks = profiles.flatMap(profile => {
    const swings = c.lastSwingsByProfile?.[profile.fieldSuffix] || [];
    return swingsToMarkers(limitSwingsForDisplay(swings), profile);
  });
  markers.push(...swingMarks.map(({ time, position, color, shape }) => ({ time, position, color, shape })));
  markers.sort((a, b) => a.time - b.time);
  c.candleSeries.setMarkers(markers);
  c.swingLabels.setMarks(swingMarks);
  updateSlLine(engineName);
  updateEntryLine(engineName);
}

function subscribeToLiveBars(db, engineName) {
  const c = charts[engineName];
  if (!c) return;
  if (c.unsubscribe) c.unsubscribe();

  const ref = doc(db, 'live_bars', engineName);
  c.unsubscribe = onSnapshot(ref, (snap) => {
    if (!snap.exists()) return;
    const data = snap.data();
    const bars = data.bars || [];
    const candles = bars.map(b => ({
      time: Math.floor(new Date(b.time).getTime() / 1000),
      open: b.open, high: b.high, low: b.low, close: b.close,
    }));
    const emaFast = bars.map(b => ({ time: Math.floor(new Date(b.time).getTime() / 1000), value: b.ema_fast }));
    const emaSlow = bars.map(b => ({ time: Math.floor(new Date(b.time).getTime() / 1000), value: b.ema_slow }));
    c.lastBars = candles;
    c.candleSeries.setData(candles);
    c.emaFastSeries.setData(emaFast);
    c.emaSlowSeries.setData(emaSlow);

    recomputeSwings(engineName, db);
    render();
    updateManualTradeProfits();
  }, (err) => console.error(`live_bars listener error (${engineName})`, err));
}

function recomputeSwings(engineName, db) {
  const c = charts[engineName];
  if (!c || !c.lastBars || !c.lastBars.length) return;

  // detect swing points once per profile here, reuse the same result for the chart
  // labels AND for syncing to Firestore - so the bot's SL uses the EXACT same points
  // shown on screen instead of re-scanning candle history itself.
  //
  // IMPORTANT: scan only CLOSED bars (drop the last one, which is still forming and
  // whose high/low can still change) - matches the closed-bars-only rule every other
  // part of the system already follows (signals, trailing stop, catastrophic SL,
  // breakout confirmation). Feeding the live bar in here let it act as the
  // right-side comparison neighbor for a candidate swing, which could invalidate a
  // genuinely new swing high/low before that live bar even finished forming - most
  // visible during a strong sustained move, where the still-moving live bar keeps
  // "beating" the most recent real turning point every single update, so it never
  // gets to confirm at all until the move pauses. The chart itself is unaffected -
  // candleSeries/emaFastSeries/emaSlowSeries render every bar including the live one;
  // only this swing scan excludes it.
  const closedCandles = c.lastBars.slice(0, -1);
  const profiles = SWING_PROFILES[engineName] || [];
  c.lastSwingsByProfile = c.lastSwingsByProfile || {};

  // All profiles for this engine (entry+carry - just H4 now that H1 is retired) merge into
  // ONE update object -> ONE setDoc call below, so having two profiles per engine
  // does not double Firestore write volume - still 1 write per engine per update.
  const swingUpdate = { updated_at: serverTimestamp() };
  let hasAnyUpdate = false;

  profiles.forEach(profile => {
    const lookback = SWING_LOOKBACK[profile.lookbackKey] ?? 3;
    const swings = findSwingPoints(closedCandles, lookback);
    c.lastSwingsByProfile[profile.fieldSuffix] = swings;
    const lastHigh = [...swings].reverse().find(s => s.type === 'high');
    const lastLow = [...swings].reverse().find(s => s.type === 'low');
    // Only include a field when we actually found a fresh value this round.
    // With merge:true, explicitly sending `null` overwrites (deletes) whatever
    // good value was already stored - so if e.g. only a low is found this pass,
    // we must NOT also send swing_high: null and wipe out a still-valid high.
    // Applied per profile independently, so one profile's miss this pass never
    // wipes the OTHER profile's still-good value on the same document.
    if (lastHigh) {
      swingUpdate[`swing_high${profile.fieldSuffix}`] = lastHigh.price;
      swingUpdate[`swing_high${profile.fieldSuffix}_time`] = lastHigh.time;
      hasAnyUpdate = true;
    }
    if (lastLow) {
      swingUpdate[`swing_low${profile.fieldSuffix}`] = lastLow.price;
      swingUpdate[`swing_low${profile.fieldSuffix}_time`] = lastLow.time;
      hasAnyUpdate = true;
    }
  });

  if (hasAnyUpdate) {
    setDoc(doc(db, 'swing_points', engineName), swingUpdate, { merge: true })
      .catch(err => console.error(`swing_points sync failed (${engineName})`, err));
  }

  updateChartMarkers(engineName);
}

function render() {
  const trades = allTrades;

  const closed = trades.filter(t => t.status === 'closed');
  const open = trades.filter(t => t.status === 'open');
  const wins = closed.filter(t => parseFloat(t.profit) > 0);
  const losses = closed.filter(t => parseFloat(t.profit) <= 0);
  const totalProfit = closed.reduce((s, t) => s + parseFloat(t.profit || 0), 0);
  const winSum = wins.reduce((s, t) => s + parseFloat(t.profit), 0);
  const lossSum = Math.abs(losses.reduce((s, t) => s + parseFloat(t.profit), 0));
  const pf = lossSum > 0 ? (winSum / lossSum) : (winSum > 0 ? Infinity : 0);
  const winRate = closed.length ? (wins.length / closed.length * 100) : 0;

  document.getElementById('statWinRate').textContent = closed.length ? `${winRate.toFixed(1)}%` : '–';
  const profitEl = document.getElementById('statProfit');
  profitEl.textContent = closed.length ? fmtMoney(totalProfit) : '–';
  profitEl.className = 'value ' + (totalProfit >= 0 ? 'pos' : 'neg');
  document.getElementById('statPF').textContent = closed.length ? (pf === Infinity ? '∞' : pf.toFixed(2)) : '–';
  document.getElementById('statOpen').textContent = open.length;


  const tbody = document.getElementById('tradeTableBody');
  const emptyState = document.getElementById('emptyState');
  const recent = [...trades].sort((a, b) => new Date(b.entry_time) - new Date(a.entry_time)).slice(0, 30);

  if (recent.length === 0) {
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
  } else {
    emptyState.style.display = 'none';
    tbody.innerHTML = recent.map(t => {
      // BUG FIX: one malformed/incomplete trade doc used to throw inside this map()
      // callback, which aborted the ENTIRE array - so a single bad row (e.g. a
      // hand-typed test doc in Firestore console missing a field) blanked out the
      // whole "เทรดล่าสุด" table, even though every other trade was fine. Skip just
      // the one bad row instead.
      try {
        let profitClass, profitText;
        if (t.status === 'closed') {
          const profit = parseFloat(t.profit || 0);
          profitClass = profit >= 0 ? 'profit-pos' : 'profit-neg';
          profitText = fmtMoney(profit);
        } else {
          ({ text: profitText, className: profitClass } = floatingProfitDisplay(t));
        }
        const { cls: openedBy, label: openedByLabel } = openedByInfo(t.opened_by);
        const timeStr = new Date(t.entry_time).toLocaleString(language === 'en' ? 'en-GB' : 'th-TH', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
        const closeBtn = t.status === 'open'
          ? `<button class="close-order-btn" onclick="window.requestCloseOrder('${t.engine}', ${t.ticket != null ? t.ticket : 'null'})">${tr('closeOrder')}</button>`
          : '';
        return `<div class="trade-card">
          <div class="trade-card-row trade-card-row-main">
            <span class="${t.direction === 'BUY' ? 'dir-buy' : 'dir-sell'}">${tradeSideLabel(t.direction)}</span>
            <span class="opened-by-tag ${openedBy}">${openedByLabel}</span>
          </div>
          <div class="trade-card-row trade-card-row-meta">
            <span class="trade-card-prices">${parseFloat(t.entry_price).toFixed(2)} → ${t.exit_price ? parseFloat(t.exit_price).toFixed(2) : '–'}</span>
            <span class="trade-card-time-profit">
              <span>${timeStr}</span>
              <span class="${profitClass}">${profitText}</span>
            </span>
            <span class="trade-card-spacer"></span>
            ${closeBtn}
          </div>
        </div>`;
      } catch (e) {
        console.error('skipping malformed trade doc in trades table', t, e);
        return '';
      }
    }).join('');
  }
}

function renderManualTradePanel() {
  const panel = document.getElementById('manualTradePanel');
  const engines = ['H4']; // H1 retired (see area notes, Sep 18 "H1 retired" decision).
  // H4 is multi_position: true in config.json and BUY/SELL run fully independently -
  // each direction's own CDC-cross lifecycle opens/manages/exits itself with no
  // cross-direction blocking (see area notes, Sep 17 "no more single-direction
  // lock" decision, and the Sep 2026 redesign notes at the top of main.py).

  panel.innerHTML = engines.map(eng => {
    const openTrades = allTrades.filter(t => t.engine === eng && t.status === 'open');

    const statusText = openTrades.length ? tr('openCount', { count: openTrades.length }) : tr('noOpen');
    const positionsHtml = openTrades.length
      ? `<div class="manual-positions">
          ${openTrades.map(t => {
            const label = openedByInfo(t.opened_by).label;
            const cls = t.direction === 'BUY' ? 'pos-buy' : 'pos-sell';
            return `<div class="manual-status open-position-row ${cls}">
              <div class="position-summary">
                <span>${tradeSideLabel(t.direction)} @ ${parseFloat(t.entry_price).toFixed(2)}</span>
                <span class="position-source">(${label})</span>
              </div>
              <span class="position-profit" data-position-profit="${allTrades.indexOf(t)}"></span>
            </div>`;
          }).join('')}
        </div>`
      : '';
    return `<div class="manual-row">
      <div class="manual-status">${statusText}</div>
    </div>
    ${positionsHtml}`;
  }).join('');
  updateManualTradeProfits();
}

window.requestManualTrade = async function(engineName, direction) {
  if (!window._dbRef) return;
  const dirLabel = tr(direction === 'BUY' ? 'buy' : 'sell');
  if (!confirm(tr('confirmOpen', { direction: dirLabel }))) return;

  const payload = {
    action: 'manual_open',
    engine: engineName,
    direction: direction,
    status: 'pending',
    created_at: serverTimestamp(),
  };

  await addDoc(collection(window._dbRef, 'commands'), payload);
  alert(tr('queuedOpen', { direction: dirLabel }));
};

window.requestCloseOrder = async function(engineName, ticket) {
  if (!window._dbRef) return;
  if (!confirm(tr('confirmClose', { ticket: ticket != null ? ' #' + ticket : '' }))) return;
  const payload = {
    action: 'close',
    engine: engineName,
    status: 'pending',
    created_at: serverTimestamp(),
  };
  if (ticket !== undefined && ticket !== null) payload.ticket = ticket;
  await addDoc(collection(window._dbRef, 'commands'), payload);
  alert(tr('queuedClose'));
};

document.getElementById('closeAllBtn').addEventListener('click', async () => {
  if (!window._dbRef) return;
  if (!confirm(tr('confirmCloseAll'))) return;
  const btn = document.getElementById('closeAllBtn');
  btn.disabled = true;
  setMessage(btn, 'pending');
  await addDoc(collection(window._dbRef, 'commands'), {
    action: 'close_all',
    status: 'pending',
    created_at: serverTimestamp(),
  });
  setTimeout(() => {
    btn.disabled = false;
    setMessage(btn, 'closeAll');
  }, 3000);
  alert(tr('queuedCloseAll'));
});

function startDashboard(db) {
  window._dbRef = db;
  renderManualTradePanel();

  setupCandleChart('H4');
  subscribeToLiveBars(db, 'H4');

  onSnapshot(collection(db, 'engine_config'), (snap) => {
    snap.docs.forEach(d => {
      const engineName = d.id;
      const enabled = d.data().enabled !== false;
      const checkbox = document.querySelector(`[data-engine-toggle="${engineName}"]`);
      const wrap = document.querySelector(`[data-engine-wrap="${engineName}"]`);
      if (checkbox) checkbox.checked = enabled;
      if (wrap) wrap.classList.toggle('disabled', !enabled);
    });
  });

  onSnapshot(doc(db, 'bot_control', 'entry_block'), (snap) => {
    const data = snap.exists() ? snap.data() : {};
    document.getElementById('entryBlockToggle').checked = data.enabled || false;
    if (data.start) document.getElementById('entryBlockStart').value = data.start;
    if (data.end) document.getElementById('entryBlockEnd').value = data.end;
  });

  onSnapshot(doc(db, 'bot_control', 'chart_display'), (snap) => {
    const data = snap.exists() ? snap.data() : {};
    for (const [field, toggle] of Object.entries(chartDisplayControls)) {
      chartDisplay[field] = data[field] !== false;
      toggle.checked = chartDisplay[field];
      toggle.disabled = false;
    }
    for (const [engineName, chart] of Object.entries(charts)) {
      chart.emaFastSeries.applyOptions({ visible: chartDisplay.show_ema });
      chart.emaSlowSeries.applyOptions({ visible: chartDisplay.show_ema });
      updateChartMarkers(engineName);
    }
  }, (error) => {
    setMessage(chartDisplayStatus, 'chartDisplayUnavailable');
    chartDisplayStatus.style.color = 'var(--red)';
    console.error('Failed to load chart visibility', error);
  });

  onSnapshot(doc(db, 'bot_control', 'entry_confirm'), (snap) => {
    const data = snap.exists() ? snap.data() : {};
    const divisor = [1, 4, 8, 16].includes(data.divisor) ? data.divisor : 1;
    document.getElementById('entryConfirmDivisor').value = String(divisor);
  });

  onSnapshot(doc(db, 'bot_control', 'server_clock'), (snap) => {
    if (!snap.exists()) return;
    const data = snap.data();
    if (!data.server_time || !data.updated_at || !data.updated_at.toMillis) return;
    const updatedMs = data.updated_at.toMillis();
    serverClockOffsetMs = new Date(data.server_time).getTime() - updatedMs;
    serverClockUpdatedMs = updatedMs;
  });

  onSnapshot(doc(db, 'bot_control', 'cdc_config'), (snap) => {
    const data = snap.exists() ? snap.data() : {};
    const fast = Number.isInteger(data.ema_fast) ? data.ema_fast : 12;
    const slow = Number.isInteger(data.ema_slow) ? data.ema_slow : 26;
    document.getElementById('cdcFast').value = String(fast);
    document.getElementById('cdcSlow').value = String(slow);
    syncCdcPresetFromInputs();
    const cdcStatusEl = document.getElementById('cdcStatus');
    if (data.version) {
      const applied = data.version === data.applied_version;
      setMessage(cdcStatusEl, applied ? 'emaApplied' : 'emaPending', { fast, slow });
      cdcStatusEl.style.color = applied ? 'var(--green)' : 'var(--text-dim)';
    }
  });

  onSnapshot(doc(db, 'bot_control', 'trailing_stop'), (snap) => {
    const data = snap.exists() ? snap.data() : {};
    document.getElementById('trailingStopToggle').checked = data.enabled !== false;  // default ON
  });

  onSnapshot(doc(db, 'bot_control', 'dow_reentry'), (snap) => {
    const data = snap.exists() ? snap.data() : {};
    document.getElementById('dowReentryToggle').checked = data.enabled === true;  // default OFF
  });

  onSnapshot(doc(db, 'bot_control', 'swing_lookback'), (snap) => {
    const data = snap.exists() ? snap.data() : {};
    // Merge over the hardcoded defaults so a brand-new deployment (Firestore
    // doc doesn't exist yet) or a partially-saved doc (e.g. only some
    // profiles ever got explicitly saved) still works correctly - never end
    // up with a profile silently missing a lookback value.
    for (const key of Object.keys(SWING_LOOKBACK_DEFAULTS)) {
      const val = data[key];
      const [min, max] = SWING_LOOKBACK_RANGE[key];
      SWING_LOOKBACK[key] = (Number.isInteger(val) && val >= min && val <= max)
        ? val : SWING_LOOKBACK_DEFAULTS[key];
      const input = document.getElementById(`swingLookback${key}`);
      if (input) input.value = SWING_LOOKBACK[key];
    }
    // Recompute RIGHT NOW using the SAME findSwingPoints() function every other
    // path already uses, against whatever bars are already cached on screen -
    // don't wait for the backend's next live_bars push (up to poll_seconds away).
    // This is the same calculation, just triggered immediately instead of on the
    // next bar update, so the chart labels visibly change the moment the value
    // is saved rather than silently updating Firestore in the background.
    //
    // A lookback KEY (e.g. "H1_entry") is not itself a chart/engine name -
    // recompute once per actual ENGINE, not once per key, or H1_entry/H1_carry
    // would each try (and silently fail) to look up a non-existent chart named
    // "H1_entry"/"H1_carry" instead of the real "H1" chart.
    for (const engine of ENGINE_NAMES) {
      recomputeSwings(engine, db);
    }
  });

  const q = query(collection(db, "trades"), orderBy("entry_time", "desc"));

  onSnapshot(q, (snapshot) => {
    allTrades = snapshot.docs.map(d => d.data());
    setConnectionStatus('connected');
    render();
    renderManualTradePanel();
    updateChartMarkers('H4');
  }, (error) => {
    setConnectionStatus('offline');
    console.error(error);
  });
}

applyLanguage(localStorage.getItem('cfd_dashboard_language') || 'th');

try {
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('dashboardContent').style.display = 'block';
      startDashboard(db);
    } else {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('dashboardContent').style.display = 'none';
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';

    if (!email || !password) {
      setMessage(errorEl, 'loginRequired');
      errorEl.style.display = 'block';
      return;
    }

    try {
      await setPersistence(auth, browserSessionPersistence);
      await signInWithEmailAndPassword(auth, email, password);
      // successful signInWithEmailAndPassword after a real <form> submit is what
      // triggers Chrome's "Save password?" prompt - no extra API call needed
    } catch (e) {
      setMessage(errorEl, 'loginInvalid');
      errorEl.style.display = 'block';
    }
  });

} catch (e) {
  console.error(e);
}
